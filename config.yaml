# path to ROSETTA or ROSETTA singularity image
rosettadir: /PATH/TO/YOUR/ROSETTA

# Path to directories
workdir: /PATH/TO/YOUR/WORKING/DIRECTORY
inputdir: PATH/TO/GITHUB/REPO/input_files

# List of samples, number of structures and mutations
samples: SAMPLE_NAME
iterations = [f"{i:04d}" for i in range(1, 201)]
mutations = [f"{m}" for m in range(1, 21)]
