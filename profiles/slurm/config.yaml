jobs: 500
cores: 1000
local-cores: 1
snakefile: snakefile-hpc
latency-wait: 120
executor: slurm
software-deployment-method: apptainer

# SLURM submission defaults — overridden per-rule via the resources block
slurm-partition: ""          # set your partition here if required
default-resources:
  runtime: "10:00:00"
  mem_mb: 4000
  cpus_per_task: 1
  slurm_extra: "--job-name=vaxpipe_{rule}_{wildcards} --error=logs/{rule}_{wildcards}.err --output=logs/{rule}_{wildcards}.out"
